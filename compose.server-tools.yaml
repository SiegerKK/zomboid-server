# Dedicated-server-only JVM extension. No MODS/Workshop/Lua checksum changes.
services:
  zomboid:
    environment:
      PZ_SERVER_TOOLS_WORLD: ${PZ_SERVER_TOOLS_WORLD:?Explicit world required}
    volumes:
      - ./server/runtime/SiegerServer.jar:/bootstrap/SiegerServer.jar:ro
      - ./server/lua:/bootstrap/sieger-server:ro
