# Independent, checksum-identical administrative runtime; no vanilla Lua injections.
services:
  zomboid:
    environment:
      MODS: ${PZ_STORY_ADMIN_MODS:?Use pz manager or supply the entire active mod list including SiegerAdmin}
    volumes:
      - ./mods/SiegerAdmin:/root/Zomboid/mods/SiegerAdmin:ro
      - ${PZ_STORY_BUNDLE:?Manager must select an audited world bundle}:/root/Zomboid/Lua/SiegerStoryBundle.txt:ro
