name: pz
services:
  zomboid:
    image: ${PZ_IMAGE:?Set an audited image digest in the VPS-only .env}
    container_name: zomboid-server
    restart: unless-stopped
    stop_grace_period: 180s
    init: true
    entrypoint: ["/bin/bash", "/bootstrap/image-entrypoint.sh"]
    # Select world by its entire data directory; keep SERVER_NAME constant
    # to avoid silently creating a new world with a different save name.
    env_file:
      - ./config/server.env
      - ${PZ_WORLD_RULES_FILE:-./config/server-rules/default.env}
      - ${PZ_MODS_FILE:-./config/mods.vanilla.env}
      - ${PZ_SECRETS_FILE:-./.env}
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
    volumes:
      - ${PZ_WORLD_DATA_DIR:-/srv/zomboid/data}:/root/Zomboid
      - /srv/zomboid/workshop:/root/.local/share/Steam/steamapps/workshop
      - ./scripts/image-entrypoint.sh:/bootstrap/image-entrypoint.sh:ro
      - ./scripts/run-redacted.py:/bootstrap/run-redacted.py:ro
    mem_limit: 12g
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
