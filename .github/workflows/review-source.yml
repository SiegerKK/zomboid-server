name: Code-only review snapshot
on:
  pull_request:
    paths: ['.github/workflows/review-source.yml']
permissions:
  contents: write
jobs:
  snapshot:
    if: github.event.pull_request.number == 29 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/zombie-behavior-debug'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8cfda809e5c56180fff61b4aeebaedd3683443a
          persist-credentials: false
      - name: Apply exact reviewed code patch without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, shutil, subprocess
          repo='SiegerKK/zomboid-server'
          blob=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/ceaf7ca14419637f70cb2b865eb6e712af22378a']))
          patch=base64.b64decode(blob['content']).replace(b'\n diff --git',b'\ndiff --git')
          assert hashlib.sha256(patch).hexdigest()=='5f5967bf27888c3d089f3d26eb8d70dbb280d3e73441fda907d838e5df168a70'
          pathlib.Path('/tmp/v8.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero','/tmp/v8.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','/tmp/v8.patch'],check=True)
          for name in ['SiegerAdminConstruction.lua','SiegerStoryAreaScan.lua','SiegerStoryBatch.lua']:
              shutil.copyfile('story/runtime/'+name,'mods/SiegerAdmin/42/media/lua/server/'+name)
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Native-shaped regression tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lua5.1
          python3 tests/test_construction_plan.py
          python3 tests/test_construction_site.py
          python3 tests/test_settlement_budget.py
          python3 tests/test_story_batch.py
          python3 tests/test_story_area_scan.py
          python3 scripts/admin_assets.py check
          lua5.1 tests/story_construction.lua story/runtime/SiegerAdminConstruction.lua
          lua5.1 tests/story_batch.lua story/runtime/SiegerStoryBatch.lua
          lua5.1 tests/story_area_scan.lua story/runtime/SiegerStoryAreaScan.lua
      - name: Store validated blobs only; leave branch update to operator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          repo='SiegerKK/zomboid-server'
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert len(paths)==12
          result=[]; cached={}
          for name in paths:
              raw=pathlib.Path(name).read_bytes()
              expected=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()
              if expected not in cached:
                  payload=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'})
                  got=json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{repo}/git/blobs','--input','-'],input=payload,text=True))
                  assert got['sha']==expected
                  cached[expected]=got['sha']
              result.append({'path':name,'mode':'100644','type':'blob','sha':expected})
          pathlib.Path('/tmp/v8-result.json').write_text(json.dumps({'base':'e8cfda809e5c56180fff61b4aeebaedd3683443a','regressions':'passed_python_and_lua51','tree_elements':result},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v8-validated-blobs
          path: /tmp/v8-result.json
          retention-days: 1
          if-no-files-found: error
