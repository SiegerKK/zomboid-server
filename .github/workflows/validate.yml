name: Check Docker configuration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          cp .env.example .env
          docker compose config --quiet
          rm .env
