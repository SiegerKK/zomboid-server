name: Check Docker configuration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 test interpreter
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          bash -n pz
          bash -n tests/smoke.sh
          sudo bash tests/smoke.sh
          bash tests/tlou_audit.sh
          python3 tests/test_generate_tlou_preset.py
          python3 tests/test_zombie_debug.py
          lua5.1 tests/zombie_debug.lua story/runtime/SiegerAdminZombieDebug.lua
          luac5.1 -p story/runtime/SiegerAdminZombieDebug.lua
          python3 tests/test_admin_runtime.py
          python3 scripts/admin_assets.py check
          lua5.1 tests/admin_clock.lua story/runtime/SiegerAdminClock.lua
          python3 tests/test_story_clock.py
          python3 tests/test_backup_info.py
          python3 tests/test_story.py
          python3 tests/test_story_live.py
          python3 tests/test_story_quest.py
          python3 tests/test_route17_campaign.py
          python3 tests/test_route17_windows.py
          python3 tests/test_story_corpse.py
          python3 tests/test_story_environment.py
          python3 tests/test_story_vehicle.py
          python3 story/storyctl.py validate smokeys_bar_06_fortification
          python3 story/storyctl.py validate smokeys_bar_07_upstairs_fortification
          python3 story/storyctl.py validate smokeys_shop_06_boarded_glass_breach
          python3 story/storyctl.py validate smokeys_shop_05_window_blood
          python3 story/storyctl.py validate smokeys_shop_04_bathroom_corpse
          python3 story/storyctl.py preview smokeys_shop_04_bathroom_corpse
          python3 -m py_compile story/campaign/route17_scan_audit.py story/campaign/autoshop_window_audit.py
          for scene in \
            smokeys_bar_01_public smokeys_bar_02_service smokeys_bar_03_upstairs \
            smokeys_bar_04_lived_in smokeys_bar_05_departure \
            smokeys_shop_01_aftermath smokeys_shop_02_details smokeys_shop_03_infected; do
            python3 story/storyctl.py validate "$scene"
            python3 story/storyctl.py preview "$scene"
          done
          python3 story/storyctl.py validate clinic_quest_001
          python3 story/storyctl.py preview clinic_quest_001
          python3 story/storyctl.py validate clinic_live_001
          python3 story/storyctl.py preview clinic_live_001
          python3 tests/test_story_area_scan.py
          python3 tests/test_story_unified.py
          python3 tests/test_story_placement.py
          python3 tests/test_story_radio.py
          python3 tests/test_story_radio_station.py
          python3 tests/test_radio_checksum.py
          python3 tests/test_radio_loudness.py
          python3 tests/test_radio_pack.py
          python3 tests/test_radio_stereo_prepare.py
          bash tests/test_radio_bridge_java.sh
          python3 tests/test_radio_volume_pan_contract.py
          python3 tests/test_story_vehicle_admin.py
          python3 tests/test_story_batch.py
          python3 tests/test_story_character.py
          lua5.1 tests/story_character.lua mods/SiegerAdmin/42/media/lua/client/SiegerStoryCharacterClient.lua story/runtime/SiegerStoryCharacter.lua mods/SiegerAdmin/42/media/lua/shared/SiegerCharacterProfiles.lua
          python3 -m py_compile story/batchctl.py
          python3 tests/test_story_module_mounts.py
          lua5.1 tests/story_vehicle_control.lua story/runtime/SiegerStoryVehicleControl.lua
          lua5.1 tests/story_batch.lua story/runtime/SiegerStoryBatch.lua
          python3 tests/test_story_ops.py
          python3 tests/test_story_tlou.py
          python3 -m py_compile story/tlouctl.py
          python3 -m py_compile story/opsctl.py
          python3 -m py_compile story/vehiclectl.py
          python3 scripts/radio_assets.py check --allow-missing-external
          python3 -m py_compile story/radioctl.py scripts/radio_assets.py
          python3 -m py_compile story/barctl.py story/campaign/smokeys_window_plan.py story/campaign/smokeys_dressing_plan.py
          python3 -m py_compile story/scanctl.py story/livectl.py story/playerctl.py story/profilectl.py
          python3 tests/test_story_compose.py
          luac5.1 -p story/runtime/SiegerStoryDirector.lua
          luac5.1 -p story/runtime/SiegerStoryAreaScan.lua
          luac5.1 -p story/runtime/SiegerStoryPlayerControl.lua
          luac5.1 -p story/runtime/SiegerStoryBarControl.lua
          luac5.1 -p story/runtime/SiegerStoryRadio.lua
          luac5.1 -p story/runtime/SiegerStoryVehicleControl.lua
          luac5.1 -p story/runtime/SiegerStoryBatch.lua
          luac5.1 -p story/runtime/SiegerStoryOps.lua
          luac5.1 -p story/runtime/SiegerStoryTLOUDiagnostics.lua
          luac5.1 -p mods/SiegerRadio/42/media/lua/server/SiegerRadioStation.lua
          luac5.1 -p mods/SiegerRadio/42/media/lua/client/SiegerRadioClient.lua
          lua5.1 tests/story_area_scan.lua story/runtime/SiegerStoryAreaScan.lua
          lua5.1 tests/story_player_control.lua story/runtime/SiegerStoryPlayerControl.lua
          lua5.1 tests/story_bar_control.lua story/runtime/SiegerStoryBarControl.lua
          lua5.1 tests/story_radio.lua story/runtime/SiegerStoryRadio.lua
          lua5.1 tests/story_radio_client.lua mods/SiegerRadio/42/media/lua/client/SiegerRadioClient.lua
          lua5.1 tests/story_radio_receiver.lua mods/SiegerRadio/42/media/lua/client/SiegerRadioClient.lua
          lua5.1 tests/story_radio_station.lua mods/SiegerRadio/42/media/lua/server/SiegerRadioStation.lua
          lua5.1 tests/story_placement.lua story/runtime/SiegerStoryDirector.lua
          lua5.1 tests/story_runtime.lua story/runtime/SiegerStoryDirector.lua
          lua5.1 tests/story_live.lua story/runtime/SiegerStoryDirector.lua
          lua5.1 tests/story_quest.lua story/runtime/SiegerStoryDirector.lua
          lua5.1 tests/story_corpse.lua story/runtime/SiegerStoryDirector.lua
          lua5.1 tests/story_environment.lua story/runtime/SiegerStoryDirector.lua
          lua5.1 tests/story_vehicle.lua story/runtime/SiegerStoryDirector.lua
          lua5.1 tests/story_ops.lua story/runtime/SiegerStoryOps.lua
          lua5.1 tests/story_tlou.lua story/runtime/SiegerStoryTLOUDiagnostics.lua
          PZ_STORY_ADMIN_MODS=SiegerAdmin PZ_STORY_BUNDLE=./story/examples/empty_bundle.lua PZ_SECRETS_FILE=./.env.example docker compose --env-file .env.example -f compose.yaml -f compose.story.yaml config --quiet
          env 'PZ_STORY_ADMIN_MODS=ZombieBuddy;StarlitLibrary;ZomboidForge;TLOU_Infected_MP;Viewpoint;ImmersiveDriving;SiegerAdmin' PZ_STORY_BUNDLE=./story/examples/empty_bundle.lua PZ_SECRETS_FILE=./.env.example docker compose --env-file .env.example -f compose.yaml -f compose.mods.yaml -f compose.story.yaml config --quiet
          PZ_SECRETS_FILE=./.env.example docker compose --env-file .env.example config --quiet
          PZ_TEST_SECRETS_FILE=./.env.example docker compose --env-file .env.example -f compose.modtest.yaml config --quiet
          python3 -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('scripts').glob('*.py')]"
          SAAS_NGINX_IMAGE=nginx:stable docker compose -f saas/compose.yaml --profile preview config --quiet
