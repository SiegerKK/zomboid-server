name: Build experimental Viewpoint Lite client ZIP

on:
  pull_request:
    paths:
      - "mods/SiegerViewpointLite/**"
      - "scripts/viewpoint_lite_pack.py"
      - "tests/test_viewpoint_lite_pack.py"
      - ".github/workflows/viewpoint-lite-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Confirm ZIP contains only independent Lua patch source
        run: |
          python3 tests/test_viewpoint_lite_pack.py
          mkdir -p dist
          python3 scripts/viewpoint_lite_pack.py build --output dist/SiegerViewpointLite-EXPERIMENTAL.zip
          (cd dist && sha256sum SiegerViewpointLite-EXPERIMENTAL.zip > SiegerViewpointLite-EXPERIMENTAL.zip.sha256)
          unzip -l dist/SiegerViewpointLite-EXPERIMENTAL.zip
      - uses: actions/upload-artifact@v4
        with:
          name: viewpoint-lite-experimental
          path: |
            dist/SiegerViewpointLite-EXPERIMENTAL.zip
            dist/SiegerViewpointLite-EXPERIMENTAL.zip.sha256
          if-no-files-found: error
          retention-days: 14
